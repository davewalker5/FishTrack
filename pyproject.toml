[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fish-track"
version = "1.0.0"
description = "A Python tool for detecting, outlining and tracking moving fish in underwater video"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.3,<3",
  "opencv-contrib-python-headless>=4.13,<5",
  "PySide6>=6.10,<7",
  "torch==2.15.0",
  "torchvision==0.29.2",
  "transformers==4.57.6",
  "pillow>=9.4,<14",
  "SAM-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4"
]

[project.scripts]
fishtrack = "fishtrack.cli:main"

[project.gui-scripts]
fishtrack-ui = "fishtrack.gui.app:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
config = ["defaults/*.json"]
fishtrack = ["resources/*.svg"]
